<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Student Performance Predictor</h1>
    <p>Enter the student's details to predict the final result.</p>

    <form action="/predict" method="POST">

        <label>Hours Studied</label>
        <input
            type="number"
            name="hours_studied"
            min="1"
            max="10"
            required
        >

        <label>Attendance (%)</label>
        <input
            type="number"
            name="attendance"
            min="50"
            max="100"
            required
        >

        <label>Previous Score</label>
        <input
            type="number"
            name="previous_score"
            min="40"
            max="100"
            required
        >

        <label>Sleep Hours</label>
        <input
            type="number"
            name="sleep_hours"
            min="4"
            max="9"
            step="0.1"
            required
        >

        <label>Assignments Completed</label>
        <input
            type="number"
            name="assignments_completed"
            min="0"
            max="10"
            required
        >

        <button type="submit">Predict Result</button>

    </form>

    {% if prediction %}

    <div class="result">
        <h2>Prediction</h2>
        <p>{{ prediction }}</p>
    </div>

    {% endif %}

</div>

</body>
</html>
